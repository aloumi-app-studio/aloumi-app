<meta property="og:title" content="Aloumi — Your recipes, adapted to your kitchen, with an AI chef">
<meta property="og:description" content="Import your recipes (link, photo, PDF, Instagram, TikTok, YouTube) and let the AI Chef adapt them to your oven and cooktop. On Google Play.">

<meta name="robots" content="noindex,follow">
<meta http-equiv="refresh" content="0; url=/en/terms/">
<script>
  // Redirection de commodité vers la langue de l'utilisateur. Les crawlers ignorent ce JS
  // et découvrent chaque langue via les hreflang ci-dessus (contenu pré-rendu, pas de JS requis).
  var LANGS = ["fr", "en", "de", "it", "es"];
  var stored; try { stored = localStorage.getItem('aloumi_lang'); } catch(e) {}
  var param = new URLSearchParams(location.search).get('lang');
  var nav = (navigator.language || '').toLowerCase();
  var browser = LANGS.filter(function(l){ return nav.indexOf(l) === 0; })[0];
  var pick = [param, stored, browser].filter(function(l){ return LANGS.indexOf(l) >= 0; })[0] || 'en';
  location.replace('/' + pick + '/terms/' + location.hash);
</script>
</head>

</body>
